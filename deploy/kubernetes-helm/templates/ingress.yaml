apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evemapper-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ .Values.cert.secretName }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evemapper-app-service
                port:
                  number: 8080